<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE-edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fifteen Puzzle Game</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>

<body>
    <div class="container">
        <div class="settings-container">
            <label for="puzzle-size">Puzzle Size</label>
            <select id="puzzle-size">
                <option value="3">3x3</option>
                <option value="4" selected>4x4</option>
                <option value="5">5x5</option>
                <option value="6">6x6</option>
                <option value="8">8x8</option>
                <option value="10">10x10</option>
            </select>

            <label for="difficulty-mode">Difficulty Mode</label>
            <select id="difficulty-mode">
                <option value="easy">Easy</option>
                <option value="normal">Normal</option>
                <option value="hard">Hard</option>
                <option value="adaptive">Adaptive</option>
            </select>
        </div>

        <div class="mode-container">
            <button id="tide-mode">Tide Mode</button>
            <button id="sunset-mode">Sunset Mode</button>
            <button id="galaxy-mode">Galaxy Mode</button>
        </div>
        <label class="sound-toggle">
            <input type="checkbox" id="sound-toggle" checked>
            Sound On
        </label>
        <!-- Basic move/time stats. Needed so the leaderboard has data to save. -->
        <div class="stats-container">
            <span id="move-counter">Moves: 0</span>
            <span id="timer-display">Time: 0s</span>
        </div>


        <div class="session-stats-container">
            <p><span style="font-weight: bold;">Sessions</span><br><span id="sessions-count">0</span></p>
            <p><span style="font-weight: bold;">Avg Moves</span><br><span id="avg-moves">0</span></p>
            <p><span style="font-weight: bold;">Avg Time</span><br><span id="avg-time">0s</span></p>
            <p><span style="font-weight: bold;">Progression</span><br><span id="progression-level">Starter</span></p>
        </div>

        <div class="puzzle-container" id="puzzle-container"></div>
        <div class="options-container">
            <button id="shuffle-btn"> Shuffle</button>
            <button id="reset-btn">Reset</button>
            <button id="magic-hint">Magic Hint</button>
        </div>
        <div id="message">Congratulations! You solved the puzzle!</div>




        <audio id="move-sound"><source src="audio/click-button.mp3" preload="auto"></audio>
        <audio id="win-sound"><source src="audio/success-chime.mp3" preload="auto"></audio>

        <div class="leaderboard-container">
            <h2>Leaderboard</h2>
            <input type="text" id="player-name" placeholder="Enter name for score records" maxlength="50">
            <table id="leaderboard-table">
                <thead>
                    <tr>
                        <th>Player</th>
                        <th>Mode</th>
                        <th>Moves</th>
                        <th>Time</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="leaderboard-body"></tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
