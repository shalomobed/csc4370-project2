<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE-edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fifteen Puzzle Game</title>
    <link rel="stylesheet" type="text/css" href="styles.css">
</head>

<body>
    <div class="container">
        <div class="mode-container">
            <button id="tide-mode">Tide Mode</button>
            <button id="breeze-mode">Breeze Mode</button>
            <button id="sun-mode">Sun Mode</button>
        </div>
        <div class="puzzle-container" id="puzzle-container"></div>
        <div class="options-container">
            <button id="shuffle-btn"> Shuffle</button>
            <button id="reset-btn">Reset</button>
            <button id="magic-hint">Magic Hint</button>
        </div>
        <!-- <div id="message">Congratulations! You solved the puzzle!</div> -->
    </div>
    <script>
        let TileSize = 97;
        let tilesArray = Array.from({length: 15 }, (_,i) => i+1).concat([0]);
        let emptyIndex = 15;
        let currentMode = 'tide_mode';

        function resetTiles(){
            tilesArray = Array.from({length: 15 }, (_,i) => i+1).concat([0]);
            emptyIndex = 15;
            renderTiles();
        }
        document.getElementById('reset-btn').addEventListener('click', resetTiles);

        function handleTileClick(index){
            if (isAdjacent(index, emptyIndex)) {
                tilesArray[emptyIndex] = tilesArray[index];
                tilesArray[index] = 0;
                emptyIndex = index;
                renderTiles();

                if (isSolved()){
                    document.getElementById('message').style.display = 'block';

                }
            }
        }
        
        function setTileImage(value, tile) {
            if (value === 0) return;
            let row_in_image = Math.floor((value - 1) / 4) + 1;
            let col_in_image = ((value - 1) % 4) + 1;

            tile.style.backgroundImage = `url(images/${currentMode}/row-${row_in_image}-column-${col_in_image}.jpg)`;
            tile.style.backgroundSize = "cover";
        }   
        
        function updateModeButtonStyles(){
            let modeButtons = [document.getElementById('tide-mode'), document.getElementById('breeze-mode'), document.getElementById('sun-mode')];  
            modeButtons.forEach((button) => {
                button.classList.remove('active-tide', 'active-breeze', 'active-sun');
            });
                if (currentMode === 'tide_mode') {
                    document.getElementById('tide-mode').classList.add('active-tide');
                } else if (currentMode === 'breeze_mode'){
                    document.getElementById('breeze-mode').classList.add('active-breeze');
                } else if (currentMode === 'sun_mode'){
                    document.getElementById('sun-mode').classList.add('active-sun');
                }
        }

        function isAdjacent(a, b) {
            let rowA = Math.floor(a / 4);
            let colA = a % 4;
            let rowB = Math.floor(b / 4);
            let colB = b % 4;

            return (Math.abs(rowA - rowB) === 1 && colA === colB) || (Math.abs(colA - colB) === 1 && rowA === rowB);
        }

        function renderTiles() {
            let container = document.getElementById('puzzle-container');
            container.innerHTML = '';
            tilesArray.forEach((value, index) => {
                let tile = document.createElement('div'); 
                tile.className = value === 0 ? 'tile empty' : 'tile';
                tile.textContent = value || '';
                tile.addEventListener('click', () => handleTileClick(index));

                let row = Math.floor(index / 4);
                let col = index % 4;
                tile.style.top = `${row * TileSize}px` ;
                tile.style.left = `${col * TileSize}px` ;

                container.appendChild(tile);
                setTileImage(value, tile);

            })
        }
        function isSolved(){
            for (let i = 0; i < 15; i++){
                if(tilesArray[i] !== i + 1){
                    return false;
                }
            }
            return true;

        }
        
        function shuffleTiles(){
            let currentEmpty = emptyIndex;
            for( let i = 0; i < 1000; i++){
                let possibleMoves = [];
                let row = Math.floor(currentEmpty / 4);
                let col = currentEmpty % 4;

                if (row > 0) possibleMoves.push(currentEmpty - 4);
                if (row < 3) possibleMoves.push(currentEmpty + 4);
                if (col > 0) possibleMoves.push(currentEmpty - 1);
                if (col < 3) possibleMoves.push(currentEmpty + 1);

                let move = possibleMoves[Math.floor(Math.random() * possibleMoves.length)];
                tilesArray[currentEmpty] = tilesArray[move];
                tilesArray[move] = 0;
                currentEmpty = move;
            }
            emptyIndex = currentEmpty;
            renderTiles();
            document.getElementById('message').style.display = 'none';
        }
        document.getElementById('shuffle-btn').addEventListener('click', shuffleTiles);
        //setTideMode(value, tile);
        renderTiles();

        document.getElementById('tide-mode').addEventListener('click', () => { currentMode = 'tide_mode'; renderTiles(); updateModeButtonStyles()});       
        document.getElementById('breeze-mode').addEventListener('click', () => { currentMode = 'breeze_mode'; renderTiles(); updateModeButtonStyles()});
        document.getElementById('sun-mode').addEventListener('click', () => { currentMode = 'sun_mode'; renderTiles(); updateModeButtonStyles()}); 

        // if (currentMode === 'breeze_mode') {
        //     document.getElementById('breeze-mode').style.color = "#ffffff";
        //     document.getElementById('breeze-mode').style.backgroundColor = "#14b8a6";
        // } 

        // if (currentMode === 'sun_mode') {
        //     document.getElementById('sun-mode').style.color = "#ffffff";
        //     document.getElementById('sun-mode').style.backgroundColor = "#14b8a6";

        // }
    </script>
</body>

</html>
